name: Validate downstream image

on:
  push:
    branches:
      - 'downstream/integration'
  pull_request:
    branches:
      - 'downstream/integration'

permissions:
  contents: read

jobs:
  validate:
    name: Build and smoke-test Bookworm application
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the base and application
        run: |
          docker build --platform linux/amd64 -f src/docker/Dockerfile-base -t archery-downstream-base:integration .
          docker build --platform linux/amd64 -f src/docker/Dockerfile -t archery-downstream:integration .
      - name: Smoke-test the application without network access
        run: |
          docker run --rm --network none --entrypoint bash \
            -e EXPECTED_DEBIAN_CODENAME=bookworm \
            -e EXPECTED_PYTHON_VERSION=3.14 \
            -e SECRET_KEY=isolated-downstream-image-smoke-check-only \
            archery-downstream:integration /opt/archery/src/docker/smoke-test.sh
